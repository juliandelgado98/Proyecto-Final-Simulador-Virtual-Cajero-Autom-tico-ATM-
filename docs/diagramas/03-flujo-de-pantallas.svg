<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 770" width="1270" height="770"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1270" height="770" fill="#ffffff"/><text x="30" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0f172a">Flujo de pantallas</text><text x="30" y="62" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#475569">Cada cuadro es una pantalla (o grupo de pantallas) de index.html. Las flechas muestran por dónde se navega.</text><rect x="50" y="100" width="120" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="110.0" y="131.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Espera</text><rect x="215" y="100" width="120" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="275.0" y="123.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Login</text><text x="275.0" y="141.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1e293b">PIN de 4 dígitos</text><rect x="380" y="100" width="170" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="465.0" y="131.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Menú principal</text><line x1="172" y1="126" x2="213" y2="126" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="192" y="116" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155" font-style="italic">tarjeta</text><line x1="337" y1="126" x2="378" y2="126" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="357" y="116" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155" font-style="italic">PIN ok</text><rect x="50" y="236" width="210" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="64" y="260.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#0f172a">Consultas</text><text x="64" y="281.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Ver saldo (resultado)</text><text x="64" y="300.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Últimos movimientos</text><line x1="465" y1="154" x2="155" y2="234" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="290" y="236" width="210" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="304" y="260.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#0f172a">Extraer efectivo</text><text x="304" y="281.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• 4 montos fijos</text><text x="304" y="300.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Otro monto (formulario)</text><text x="304" y="318.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Procesando → resultado</text><line x1="465" y1="154" x2="395" y2="234" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="530" y="236" width="210" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="544" y="260.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#0f172a">Transferencias</text><text x="544" y="281.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Nueva: por CBU o por alias</text><text x="544" y="300.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Historial</text><line x1="465" y1="154" x2="635" y2="234" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="770" y="236" width="210" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="784" y="260.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#0f172a">Pago de servicios</text><text x="784" y="281.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Pagar servicios</text><text x="784" y="300.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Recargar celular / SUBE</text><text x="784" y="318.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Últimos pagos</text><text x="784" y="337.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Próximos vencimientos</text><line x1="465" y1="154" x2="875" y2="234" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="1010" y="236" width="210" height="112" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1024" y="260.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#0f172a">Gestionar claves</text><text x="1024" y="281.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Formulario con 3 campos</text><text x="1024" y="300.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b">• Éxito → menú principal</text><line x1="465" y1="154" x2="1115" y2="234" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="155" y1="350" x2="155" y2="392" stroke="#334155" stroke-width="1.8"/><line x1="395" y1="350" x2="395" y2="392" stroke="#334155" stroke-width="1.8"/><line x1="635" y1="350" x2="635" y2="392" stroke="#334155" stroke-width="1.8"/><line x1="875" y1="350" x2="875" y2="392" stroke="#334155" stroke-width="1.8"/><line x1="155" y1="392" x2="875" y2="392" stroke="#334155" stroke-width="1.8"/><text x="888" y="384" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">operación exitosa</text><rect x="410" y="470" width="210" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="515.0" y="502.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Resultado</text><text x="515.0" y="520.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1e293b">mensaje + saldo nuevo</text><line x1="515" y1="392" x2="515" y2="468" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="680" y="470" width="210" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="785.0" y="502.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Comprobante</text><text x="785.0" y="520.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1e293b">¿imprimir? → ticket</text><line x1="622" y1="505" x2="678" y2="505" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="650" y="495" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155" font-style="italic">imprimir</text><rect x="1010" y="470" width="210" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="1115.0" y="502.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Éxito</text><text x="1115.0" y="520.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1e293b">clave cambiada / retire ticket</text><line x1="892" y1="505" x2="1008" y2="505" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="950" y="495" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#334155" font-style="italic">continuar</text><line x1="1115" y1="350" x2="1115" y2="468" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="1125" y="420" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">clave modificada</text><rect x="50" y="470" width="220" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="160.0" y="502.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Salida</text><text x="160.0" y="520.0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1e293b">retire su tarjeta</text><path d="M 275 154 V 405 H 160 V 468" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#punta)"/><text x="284" y="438" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#dc2626" font-style="italic">3 PIN incorrectos</text><path d="M 50 505 H 26 V 126 H 48" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="34" y="458" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">Nueva sesión</text><text x="160" y="568" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1e293b" font-style="italic">Botón «Salir» (desde cualquier pantalla)</text><rect x="410" y="610" width="810" height="108" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="425" y="633" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="start" fill="#0f172a">Pantallas de apoyo (se muestran desde cualquier operación)</text><text x="425" y="660" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">Error:  muestra el motivo del rechazo. «Aceptar» vuelve a la pantalla anterior</text><text x="425" y="682" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">(o a Salida si se agotaron los intentos de PIN).</text><text x="425" y="705" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">Proceso: «Contando billetes...» durante 1,5 segundos en la extracción de efectivo.</text></svg>