a04" stroke-width="1.6" stroke-dasharray="4 3"/><text x="800.0" y="678" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Si devuelve false: mostrarErrorFormulario(formulario, motivoRechazo)</text><text x="800.0" y="696" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">y la pantalla no cambia.</text><line x1="936.0" y1="740" x2="664.0" y2="740" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="800.0" y="732" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">mostrarResultado(titulo, mensaje, retorno)</text><line x1="656.0" y1="786" x2="384.0" y2="786" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="520.0" y="763" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">mostrarPantalla("pantallaResultado")</text><text x="520.0" y="778" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">actualizarPantalla() → saldo nuevo</text><line x1="376.0" y1="846" x2="104.0" y2="846" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#punta)"/><text x="240.0" y="838" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Ve «Transferencia realizada»</text></svg>