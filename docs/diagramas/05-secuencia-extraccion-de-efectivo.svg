nt-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">Si el usuario presiona CANCELAR durante la espera, vuelve al menú</text><text x="240.0" y="486" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a">y no se descuenta nada.</text><line x1="1216.0" y1="530" x2="384.0" y2="530" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#punta)"/><text x="800.0" y="522" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">pasan 1,5 s → finalizarExtraccion(5000)</text><path d="M 384.0 570 h 34 v 22 h -30" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="426.0" y="580" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">¿sigue en pantallaProceso?</text><text x="426.0" y="595" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Si no, la extracción se cancela</text><line x1="384.0" y1="638" x2="656.0" y2="638" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="520.0" y="630" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#0f172a" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">extraerEfectivo(5000)</text><path d="M 664.0 678 h 34 v 22 h -30" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="706.0" y="688" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-ancho