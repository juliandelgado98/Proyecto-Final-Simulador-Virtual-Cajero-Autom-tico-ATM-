<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 790" width="1070" height="790"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1070" height="790" fill="#ffffff"/><text x="30" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0f172a">Arquitectura por capas</text><text x="30" y="62" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#475569">Cada capa solo habla con la de al lado: la interfaz nunca llama directamente a la lógica.</text><rect x="325" y="88" width="340" height="44" rx="22" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="495" y="115" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e293b">Usuario: toca botones y teclas del cajero</text><rect x="175" y="172" width="640" height="98" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="189" y="197" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">1. Interfaz  (lo que se ve)</text><text x="189" y="218.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">index.html: todas las pantallas ya escritas; solo una está visible (atributo hidden)</text><text x="189" y="237.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">css/: base · layout · pantallas · componentes · accesibilidad</text><rect x="175" y="322" width="640" height="118" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="189" y="347" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">2. Eventos y utilidades  (js/utiles/)</text><text x="189" y="368.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">ui.js: conectarEventos, mostrarPantalla, mostrarResultado y los tres registros</text><text x="189" y="387.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">teclado.js: teclado numérico físico y campo activo</text><text x="189" y="406.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">formato.js · validaciones.js: moneda y validación de datos</text><rect x="175" y="492" width="640" height="118" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="189" y="517" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">3. Pantallas  (js/pantallas/)</text><text x="189" y="538.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">mostrarPantalla*: navegación entre pantallas</text><text x="189" y="557.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">procesar*: leen el formulario, llaman al cajero y muestran el resultado</text><text x="189" y="576.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">renderizar*: dibujan las listas (historial, movimientos, vencimientos)</text><rect x="175" y="662" width="640" height="98" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><text x="189" y="687" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">4. Lógica del cajero  (js/operaciones/ + js/estado/)</text><text x="189" y="708.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">class CajeroAutomatico: propiedades y reglas de negocio (PIN, saldo, límites)</text><text x="189" y="727.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">No toca el HTML: responde true / false y deja el motivo en motivoRechazo</text><line x1="365" y1="130" x2="365" y2="170" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="375" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">clic o tecla</text><line x1="365" y1="270" x2="365" y2="320" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="375" y="300" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">evento click / submit</text><line x1="365" y1="440" x2="365" y2="490" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="375" y="462" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">accionesBoton · manejadoresFormulario · renderizadoresPantalla</text><line x1="365" y1="610" x2="365" y2="660" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="375" y="640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">cajero.método(datos)</text><line x1="645" y1="660" x2="645" y2="612" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#punta)"/><text x="655" y="640" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">true / false + motivoRechazo</text><path d="M 175 560 H 123 V 220 H 173" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="14" y="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">Las pantallas</text><text x="14" y="346" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">actualizan lo</text><text x="14" y="362" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">que se ve:</text><text x="14" y="384" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">mostrarPantalla</text><text x="14" y="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#334155" font-style="italic">textContent</text><rect x="880" y="322" width="180" height="118" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="894" y="347" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">main.js</text><text x="894" y="368.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">crea el cajero,</text><text x="894" y="387.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">conecta los eventos y</text><text x="894" y="406.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">muestra la espera</text><line x1="880" y1="381" x2="817" y2="381" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="848" y="372" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" font-style="italic">inicia</text><rect x="880" y="662" width="180" height="98" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="894" y="687" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">js/config/</text><text x="894" y="708.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">constantes.js</text><text x="894" y="727.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1e293b">datos-simulados.js</text><line x1="880" y1="711" x2="817" y2="711" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><text x="848" y="702" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#334155" font-style="italic">lee</text></svg>