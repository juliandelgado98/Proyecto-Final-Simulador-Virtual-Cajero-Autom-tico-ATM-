<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640"><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect width="1300" height="640" fill="#ffffff"/><text x="30" y="38" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="start" fill="#0f172a">Cómo se conectan los botones con las funciones</text><text x="30" y="62" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="normal" text-anchor="start" fill="#475569">Un único listener en document atiende todos los clics y envíos. Para agregar un botón nuevo alcanza con 2 pasos.</text><text x="30" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">1. Atributo en el HTML</text><text x="410" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">2. Listener (ui.js)</text><text x="680" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">3. Registro (ui.js)</text><text x="1000" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#0f172a">4. Función que se ejecuta</text><rect x="30" y="120" width="330" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="150" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">&lt;button data-destino="pantallaPagos"&gt;</text><text x="44" y="174" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b" font-style="italic">Navegar a otra pantalla</text><rect x="410" y="120" width="220" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="420" y="164" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">click → data-destino</text><rect x="680" y="120" width="270" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="692" y="164" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">sin registro (directo)</text><rect x="1000" y="120" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1012" y="164" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">mostrarPantalla("pantallaPagos")</text><line x1="362" y1="158" x2="408" y2="158" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="632" y1="158" x2="678" y2="158" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="952" y1="158" x2="998" y2="158" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="30" y="212" width="330" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="242" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">&lt;button data-accion="consultarSaldo"&gt;</text><text x="44" y="266" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b" font-style="italic">Ejecutar una acción</text><rect x="410" y="212" width="220" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="420" y="256" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">click → data-accion</text><rect x="680" y="212" width="270" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="692" y="256" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">accionesBoton["consultarSaldo"]</text><rect x="1000" y="212" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1012" y="256" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">procesarConsultaSaldo()</text><line x1="362" y1="250" x2="408" y2="250" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="632" y1="250" x2="678" y2="250" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="952" y1="250" x2="998" y2="250" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="30" y="304" width="330" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="334" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">&lt;form data-operacion="transferirCbu"&gt;</text><text x="44" y="358" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b" font-style="italic">Enviar un formulario</text><rect x="410" y="304" width="220" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="420" y="348" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">submit → data-operacion</text><rect x="680" y="304" width="270" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="692" y="338" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">manejadoresFormulario[</text><text x="692" y="355" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">  "transferirCbu"]</text><rect x="1000" y="304" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1012" y="338" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">procesarTransferenciaCbu(</text><text x="1012" y="355" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">  formulario)</text><line x1="362" y1="342" x2="408" y2="342" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="632" y1="342" x2="678" y2="342" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="952" y1="342" x2="998" y2="342" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="30" y="396" width="330" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="426" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">&lt;button class="teclaFisica"&gt;</text><text x="44" y="450" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b" font-style="italic">Teclado numérico del cajero</text><rect x="410" y="396" width="220" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="420" y="440" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">click → clase teclaFisica</text><rect x="680" y="396" width="270" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="692" y="440" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">sin registro (directo)</text><rect x="1000" y="396" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1012" y="440" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">procesarTeclaFisica(boton)</text><line x1="362" y1="434" x2="408" y2="434" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="632" y1="434" x2="678" y2="434" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="952" y1="434" x2="998" y2="434" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="30" y="488" width="330" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/><text x="44" y="518" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">mostrarPantalla("pantallaHistorial")</text><text x="44" y="542" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1e293b" font-style="italic">Al mostrar cualquier pantalla</text><rect x="410" y="488" width="220" height="76" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.6"/><text x="420" y="532" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">dentro de mostrarPantalla</text><rect x="680" y="488" width="270" height="76" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/><text x="692" y="522" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">renderizadoresPantalla[</text><text x="692" y="539" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">  "pantallaHistorial"]</text><rect x="1000" y="488" width="260" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="1012" y="532" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" text-anchor="start" fill="#0f172a">renderizarHistorial()</text><line x1="362" y1="526" x2="408" y2="526" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="632" y1="526" x2="678" y2="526" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><line x1="952" y1="526" x2="998" y2="526" stroke="#334155" stroke-width="1.8" marker-end="url(#punta)"/><rect x="30" y="584" width="1230" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="46" y="606" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">Para agregar un botón nuevo:  1) poner data-destino, data-accion o data-operacion en el HTML.</text><text x="46" y="626" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#0f172a">2) registrar su función:  accionesBoton.miAccion = miFuncion;   o   manejadoresFormulario.miFormulario = miFuncion;</text></svg>